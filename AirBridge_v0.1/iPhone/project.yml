name: PCPulse

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  PCPulse:
    type: application
    platform: iOS
    sources:
      - PCPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PCPulse
        INFOPLIST_FILE: PCPulse/Info.plist

workflows:
  pc-pulse-ios:
    name: PC Pulse iOS Device Build
    max_build_duration: 30

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/iPhone"
          xcodegen generate
          ls -la

      - name: Build unsigned iPhone app
        script: |
          cd "$CM_BUILD_DIR/iPhone"

          xcodebuild \
            -project PCPulse.xcodeproj \
            -scheme PCPulse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        script: |
          set -e

          APP_PATH=$(find "$CM_BUILD_DIR/build/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app was not found."
            exit 1
          fi

          echo "Found app: $APP_PATH"

          mkdir -p "$CM_BUILD_DIR/artifacts/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/artifacts/Payload/PCPulse.app"

          cd "$CM_BUILD_DIR/artifacts"
          /usr/bin/zip -qry PCPulse_unsigned.ipa Payload

          echo "Created:"
          ls -lh "$CM_BUILD_DIR/artifacts/PCPulse_unsigned.ipa"

    artifacts:
      - artifacts/PCPulse_unsigned.ipa
      - build/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
